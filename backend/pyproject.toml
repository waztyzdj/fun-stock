[project]
name = "fun-stock-backend"
version = "0.1.0"
description = "Backend service for the Fun Stock strategy and backtesting platform."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "fastapi[standard]>=0.115.0",
    "pandas>=2.2.0",
    "polars>=1.18.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "tushare>=1.4.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "UP",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "tushare.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

