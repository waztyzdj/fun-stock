name: fun-stock

services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: fun-stock-postgres
    environment:
      POSTGRES_DB: fun_stock
      POSTGRES_USER: fun_stock
      POSTGRES_PASSWORD: fun_stock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fun_stock -d fun_stock"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-bookworm
    container_name: fun-stock-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: fun-stock-backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://fun_stock:fun_stock@postgres:5432/fun_stock
      REDIS_URL: redis://redis:6379/0
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
    container_name: fun-stock-celery-worker
    command: uv run celery -A app.core.celery_app:celery_app worker --loglevel=INFO --concurrency=1
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://fun_stock:fun_stock@postgres:5432/fun_stock
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
    container_name: fun-stock-celery-beat
    command: uv run celery -A app.core.celery_app:celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://fun_stock:fun_stock@postgres:5432/fun_stock
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: fun-stock-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    command: sh -c "CI=true pnpm install --frozen-lockfile && pnpm exec vite --host 0.0.0.0 --port 5175"
    ports:
      - "5175:5175"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
